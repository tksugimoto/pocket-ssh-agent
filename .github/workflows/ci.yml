name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Verify modules
        run: go mod verify
      - name: Vet (linux, windows, darwin)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install OpenSSH server
        run: sudo apt-get update -q && sudo apt-get install -y -q openssh-server
      - run: npm ci --ignore-scripts
      - name: Agent + scripted phone + OpenSSH
        run: bash scripts/e2e.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Agent + PWA in Chromium
        run: node test/e2e/ui.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in Docker
        run: docker build --target test .
      - name: Build binaries in Docker
        run: |
          docker build --target dist --output dist .
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          PWA_URL: ${{ vars.PWA_URL }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12} -X main.defaultWebURL=${PWA_URL}" -o "dist/pocket-ssh-agent${{ matrix.ext }}" ./cmd/pocket-ssh-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocket-ssh-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
